name: Browser-Version (GitHub Pages)

# Baut das Spiel mit pygbag zu WebAssembly und veröffentlicht es auf
# GitHub Pages. Voraussetzung: In den Repository-Einstellungen unter
# "Pages" die Quelle auf "GitHub Actions" stellen.

on:
  push:
    branches:
      - main
      - "claude/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pygbag
      - name: Nur Spieldateien bündeln
        run: rm -rf tests .github
      - name: Mit pygbag bauen
        run: python -m pygbag --build --ume_block 0 --can_close 1 .
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
